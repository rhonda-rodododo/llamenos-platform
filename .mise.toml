# mise configuration — https://mise.jdx.dev/
#
# Run `mise install` once to activate all tool versions.
# Run `mise run --list` to see available tasks.
#
# Rust: NOT pinned here — apps/desktop/rust-toolchain.toml (1.85.0) and
# packages/crypto/rust-toolchain.toml (stable) handle per-workspace pinning.
# mise respects rust-toolchain.toml automatically via rustup. Ensure rustup
# is installed: https://rustup.rs — or install the `rust` backend via mise
# if you want mise to manage rustup itself (`mise use rust@stable`).
#
# Swift: macOS-only — managed by Xcode. Xcode 16+ (iOS 17+ target, swift-tools-version 5.9).
# Install via App Store or https://developer.apple.com/xcode/
#
# Docker Compose: not mise-managed. Install via Docker Desktop or your distro package manager.

[tools]
bun  = "1.3.5"          # Keep in sync with .github/workflows/ci.yml bun-version
java = "temurin-17.0"   # Required for Android builds (AGP 9.1 + Kotlin 2.3)
ruby = "3.3"            # Required for Fastlane (apps/ios/fastlane + apps/android/fastlane)
                        # After `mise install`, run: cd apps/ios && bundle install

[env]
ENVIRONMENT = "development"

# ── Tasks ──────────────────────────────────────────────────────────────────
# These tasks are discovery helpers for new contributors.
# All `bun run` scripts in package.json continue to work unchanged.
# CI uses `bun run` directly — mise tasks are not required for CI.

[tasks.setup]
description = "Check prerequisites and install all dependencies"
run         = "bash scripts/dev-setup.sh"

[tasks.dev]
description = "Start local backend (PostgreSQL + backing services + Bun server)"
run         = [
  "docker compose -f deploy/docker/docker-compose.dev.yml up -d",
  "bun run dev:server",
]

[tasks."dev:desktop"]
description = "Start Tauri desktop app (Vite + Rust — requires Rust toolchain)"
run         = "bun run tauri:dev"

[tasks.test]
description = "Run Playwright E2E tests (desktop — no Rust required)"
run         = "bun run test"

[tasks."test:backend"]
description = "Run backend BDD tests (requires local backend running)"
run         = "bun run test:backend:bdd"

[tasks."test:android"]
description = "Run Android unit tests + lint (requires JDK 17 + Android SDK)"
run         = "bun run test:android"

[tasks."test:ios"]
description = "Run iOS unit tests via xcodebuild (macOS + Xcode 16+ required)"
run         = "bun run ios:test"

[tasks."test:crypto"]
description = "Run Rust crypto tests (requires Rust toolchain)"
run         = "bun run crypto:test"

[tasks.typecheck]
description = "TypeScript type check (no emit)"
run         = "bun run typecheck"

[tasks.build]
description = "Vite production build"
run         = "bun run build"

[tasks.codegen]
description = "Regenerate TypeScript/Swift/Kotlin types from Zod schemas"
run         = "bun run codegen"

[tasks.lint]
description = "Run ESLint across client and worker"
run         = "bun run lint"

[tasks."crypto:build:ios"]
description = "Build Rust crypto XCFramework for iOS (macOS + Rust required)"
run         = "packages/crypto/scripts/build-mobile.sh ios"

[tasks."crypto:build:android"]
description = "Build Rust crypto JNI libs for Android (Rust + NDK required)"
run         = "packages/crypto/scripts/build-mobile.sh android"

[tasks."fastlane:ios"]
description = "Run Fastlane for iOS (run `cd apps/ios && bundle install` first)"
run         = "cd apps/ios && bundle exec fastlane"

[tasks."fastlane:android"]
description = "Run Fastlane for Android (run `cd apps/ios && bundle install` first)"
run         = "cd apps/android && bundle exec fastlane"
