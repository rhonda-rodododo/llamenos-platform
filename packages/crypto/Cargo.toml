[package]
name = "llamenos-core"
version = "0.2.0"
edition = "2021"
description = "Shared cryptographic core for Llamenos — Ed25519/X25519, HPKE (RFC 9180), AES-256-GCM, sigchain"
license = "AGPL-3.0-or-later"
repository = "https://github.com/rhonda-rodododo/llamenos-platform"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
# Ed25519 signing
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }

# X25519 key agreement
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }

# HPKE: DHKEM(X25519, HKDF-SHA256) + HKDF-SHA256 + AES-256-GCM
hpke = { version = "0.13", default-features = false, features = ["x25519", "alloc"] }

# AES-256-GCM (standalone symmetric operations — PIN encryption, items_key)
aes-gcm = "0.10"

# Key derivation
hkdf = "0.12"
argon2 = "0.5"

# Hashing
sha2 = "0.10"
hmac = "0.12"

# Memory safety for key material
zeroize = { version = "1", features = ["derive"] }

# Unicode normalization (for blind index canonicalization)
unicode-normalization = "0.1"

# Date/time (for blind index epoch bucketing)
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

# Encoding
hex = "0.4"
base64 = "0.22"

# Randomness
rand = "0.8"
getrandom = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Constant-time comparison
subtle = "2"

# Error handling
thiserror = "2"

# UniFFI for Swift/Kotlin bindings
uniffi = { version = "0.31", optional = true }


# MLS (RFC 9420) — always compiled in
openmls = { version = "0.8", features = ["openmls_rust_crypto"] }
openmls_rust_crypto = "0.5"
openmls_basic_credential = "0.5"

# BIP-340 Schnorr / secp256k1 (for sign_prehash / verify_prehash)
k256 = { version = "0.13", features = ["schnorr"] }
[features]
default = []
server = []
# test-kdf: Use fast Argon2id parameters (m=8KB, t=1, p=1) instead of production
# params (m=64MB, t=3, p=4). SECURITY: This feature MUST ONLY be enabled in test/debug
# builds — never in release builds shipped to users. It reduces KDF brute-force
# resistance from ~seconds to ~microseconds per guess.
test-kdf = []
mobile = ["dep:uniffi"]
uniffi-bindgen = ["mobile", "uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["uniffi-bindgen"]


[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

# UniFFI bindgen needs unstripped binary to read metadata symbols.
# Use this profile when generating bindings: cargo build --profile release-bindgen
[profile.release-bindgen]
inherits = "release"
strip = false
