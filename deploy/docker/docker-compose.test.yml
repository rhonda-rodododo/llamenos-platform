# Docker Compose override for E2E tests
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build app
#   # Then wait for health: timeout 120 bash -c 'until curl -sf http://localhost:3000/api/health; do sleep 2; done'
#
# Changes from production:
#   - Exposes app port 3000 directly (bypasses Caddy)
#   - Sets ENVIRONMENT=development (enables /api/test-reset endpoint)
#   - Disables read_only to allow SQLite WAL files in tmpfs
#   - Applies CI-compatible health check settings
#   - Configures signal-notifier and sip-bridge in test mode

services:
  # Expose PostgreSQL to the host so backend-bdd tests (db-helpers.ts) can
  # query the database directly from the Playwright test runner.
  postgres:
    ports:
      - "5432:5432"
    # Base compose puts postgres on `internal` only (internal: true blocks host
    # port exposure). Add `web` so the port mapping actually works in CI.
    networks:
      - internal
      - web

  app:
    # Import the registry-hosted BuildKit layer cache that
    # .github/workflows/docker-buildcache.yml refreshes nightly (and on any
    # main-branch change to bun.lockb/packages/crypto//Dockerfile — see that
    # workflow for why). This is the fix for #902: bootstrap-backend's
    # `docker compose up -d --build --wait app` runs on a fresh ubuntu-latest
    # runner with an empty local cache every time, so without this the
    # `deps` (bun install) and `rust-builder` (cargo build --release) stages
    # rebuilt from scratch on every CI run regardless of what actually
    # changed. Docker still invalidates by content hash on import — a PR
    # that changes bun.lockb or packages/crypto/** still rebuilds exactly
    # those layers — this only lets an unrelated-file PR pull instead of
    # rebuild. Cache import is a soft dependency: a missing/unreachable tag
    # falls back to a normal build rather than failing the job. The ref
    # below is the literal form of `ghcr.io/${{ github.repository }}` (the
    # same public GHCR package release.yml's docker-stable job already
    # publishes real images to) — update it if the repo is ever renamed or
    # transferred.
    build:
      cache_from:
        - type=registry,ref=ghcr.io/rhonda-rodododo/llamenos-platform:buildcache
    ports:
      - "${APP_PORT:-3000}:3000"
    read_only: false
    environment:
      - ENVIRONMENT=development
      - DEV_ROUTES_ENABLED=true
      - DEV_RESET_SECRET=${DEV_RESET_SECRET:-test-reset-secret}
      - TOKEN_MAX_AGE_MS=${TOKEN_MAX_AGE_MS:-3600000}
      # CI has no real reverse proxy in front of the app, but the BDD suite
      # simulates one (CF-Connecting-IP) to test per-client rate-limit
      # buckets — same trust posture as docker-compose.production.yml.
      - TRUST_PROXY_HEADERS=true
      # Wire up sidecar services so integration tests can reach them
      - NOTIFIER_URL=http://signal-notifier:3100
      - NOTIFIER_API_KEY=${NOTIFIER_API_KEY:-ci-test-notifier-key}
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    # Override production healthcheck: in CI, sidecars start AFTER the app
    # (bootstrap-backend runs `--wait app` first, then starts sidecar profiles).
    # The production healthcheck uses /api/health/ready which requires signal-notifier,
    # causing a chicken-and-egg deadlock. Use /api/health/live (process check only) here
    # and let the bootstrap-backend action verify full readiness separately.
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Signal sidecar: test mode ──────────────────────────────────────
  # signal-cli runs in json-rpc mode; AUTO_RECEIVE_SCHEDULE disabled in CI
  # so the webhook-based tests control message flow entirely.
  # Healthcheck: in CI no Signal number is registered so /v1/about returns 503.
  # Override to just check the process is listening (TCP check on port 8080).
  signal-cli:
    environment:
      - MODE=json-rpc
      - AUTO_RECEIVE_SCHEDULE=
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/about || true"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # signal-notifier: expose port so BDD tests can hit /health and /notify directly.
  # Don't depend on signal-cli being healthy — in CI it has no registered number.
  signal-notifier:
    ports:
      - "3100:3100"
    depends_on:
      signal-cli:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - PORT=3100
      - NOTIFIER_API_KEY=${NOTIFIER_API_KEY:-ci-test-notifier-key}
      - NOTIFIER_TOKEN_SECRET=${NOTIFIER_TOKEN_SECRET:-ci-test-token-secret}
      - DATABASE_URL=postgres://llamenos:${PG_PASSWORD:-dev}@postgres:5432/llamenos?sslmode=disable
      - SIGNAL_BRIDGE_URL=http://signal-cli:8080
      - SIGNAL_REGISTERED_NUMBER=${SIGNAL_REGISTERED_NUMBER:-+15550000000}

  # ── Asterisk sidecar: test mode ────────────────────────────────────
  # sip-bridge points to the mock ARI endpoint; BRIDGE_SECRET and
  # ARI_PASSWORD come from .env (set to ci-test-* values in CI).
  # Expose port 3001 → 3000 so backend-bdd health check tests can reach the
  # bridge from the host. Base compose puts sip-bridge on `internal` only.
  sip-bridge:
    ports:
      - "3001:3000"
    networks:
      - internal
      - web
    environment:
      - ARI_URL=ws://asterisk:8088/ari/events
      - ARI_REST_URL=http://asterisk:8088/ari
      - ARI_USERNAME=llamenos
      - ARI_PASSWORD=${ARI_PASSWORD:-ci-ari-password}
      - WORKER_WEBHOOK_URL=http://app:3000
      - BRIDGE_SECRET=${BRIDGE_SECRET:-ci-test-bridge-secret}
      - CONNECTION_TIMEOUT_MS=60000
