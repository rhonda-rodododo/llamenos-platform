# Production overrides for Llamenos Docker deployment
#
# Adds: production Caddyfile (real domain + TLS), resource limits, log rotation,
# hardened container options (read-only rootfs, no-new-privileges), and
# Watchtower for automated image updates.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
#
# Required env vars (set in .env):
#   APP_DOMAIN      — e.g. app.hotline.example
#   API_DOMAIN      — e.g. api.hotline.example
#   CRYPTO_DOMAIN   — e.g. crypto.hotline.example
#   ACME_EMAIL      — Let's Encrypt contact email
#   BUILD_VERSION   — image tag to deploy (set by CI)
#   BUILD_COMMIT    — git SHA (set by CI)
#   GHCR_USERNAME   — GitHub username for GHCR pull auth
#   GHCR_TOKEN      — GitHub PAT with packages:read

services:
  app:
    environment:
      - ENVIRONMENT=production
      # Tier 4 PR-A: API enforces cross-site CORS/cookies scoped to the SPA origin.
      - APP_ORIGIN=https://${APP_DOMAIN:?APP_DOMAIN is required}
      - API_COOKIE_DOMAIN=${API_DOMAIN:?API_DOMAIN is required}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "llamenos-app"
    healthcheck:
      # Tighter production intervals (vs dev defaults)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    # Tier 4 PR-A: override the base caddy:2-alpine image with a local
    # build that bakes dist/client + dist/crypto-sandbox into /srv/app and
    # /srv/crypto. The same Caddy process still terminates TLS and
    # handles all three origins via Caddyfile.production site blocks.
    image: llamenos-static:local
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: static
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        BUILD_COMMIT: ${BUILD_COMMIT:-local}
        BUILD_TIME: ${BUILD_TIME:-}
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
    environment:
      - APP_DOMAIN=${APP_DOMAIN:?APP_DOMAIN is required — e.g. app.hotline.example}
      - API_DOMAIN=${API_DOMAIN:?API_DOMAIN is required — e.g. api.hotline.example}
      - CRYPTO_DOMAIN=${CRYPTO_DOMAIN:?CRYPTO_DOMAIN is required — e.g. crypto.hotline.example}
      - ACME_EMAIL=${ACME_EMAIL:?ACME_EMAIL is required}
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "llamenos-caddy"
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        tag: "llamenos-postgres"
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  rustfs:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "llamenos-rustfs"
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Optional profiles: resource limits ─────────────────────

  ntfy:
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16M
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
        tag: "llamenos-ntfy"

  whisper:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  asterisk:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  asterisk-bridge:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  signal-cli:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  signal-notifier:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  glitchtip:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  glitchtip-worker:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Docker Socket Proxy — restricts Watchtower's daemon access ──
  # Watchtower connects to this proxy instead of the raw docker.sock.
  # Whitelist: CONTAINERS + IMAGES only. All exec/write APIs blocked.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476  # pinned 2026-05-18
    restart: unless-stopped
    privileged: true  # required: needs read access to host docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Allow only what Watchtower needs: list containers + pull/update images
      - CONTAINERS=1
      - IMAGES=1
      # Deny everything else (explicit for auditing — all default to 0)
      - AUTH=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - GRPC=0
      - INFO=0
      - NETWORKS=0
      - NODES=0
      - PLUGINS=0
      - POST=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0
    networks:
      - docker-proxy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ── Watchtower: automated image update checks ─────────────
  watchtower:
    image: containrrr/watchtower:1.7.1@sha256:6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038  # pinned 2026-05-18
    restart: unless-stopped
    # No docker.sock volume — connects via docker-socket-proxy instead
    environment:
      # Point Watchtower at the restricted socket proxy
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      # Only watch containers with the watchtower.enable=true label
      - WATCHTOWER_LABEL_ENABLE=true
      # Cron schedule for update checks (default: 04:00 UTC daily)
      - WATCHTOWER_SCHEDULE=${WATCHTOWER_SCHEDULE:-0 0 4 * * *}
      # Remove old images after updating
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LOG_LEVEL=${WATCHTOWER_LOG_LEVEL:-info}
      # GHCR authentication (if image is private)
      - REPO_USER=${GHCR_USERNAME:-}
      - REPO_PASS=${GHCR_TOKEN:-}
      # Optional: shoutrrr URL for update notifications
      # e.g. slack://token-a/token-b/token-c or discord://token@id
      - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL:-}
    networks:
      - docker-proxy  # only needs proxy network, not web or internal
    depends_on:
      - docker-socket-proxy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  docker-proxy:
    driver: bridge
    internal: true  # isolated network — only docker-socket-proxy and watchtower
