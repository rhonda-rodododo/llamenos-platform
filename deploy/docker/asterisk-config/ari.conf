; ============================================================
; ARI Configuration for Llamenos
; ============================================================
; This enables the Asterisk REST Interface (ARI) that the
; bridge service connects to via WebSocket and HTTP.
;
; Place this file in /etc/asterisk/ari.conf
; ============================================================

[general]
enabled = yes
; pretty = yes          ; Uncomment for human-readable JSON (dev only)
; allowed_origins = *   ; CORS origins (restrict in production)

[llamenos]
type = user
read_only = no
password_format = plain
; Asterisk does NOT expand environment variables in config files, so the
; password line is rendered from ARI_PASSWORD by the compose `ari_credentials`
; config (see deploy/docker/docker-compose.yml) — it must match ARI_PASSWORD
; in the sip-bridge env.
#include "/run/llamenos/ari-credentials.conf"
