---
# Llamenos Deployment Configuration
# 
# This is a template configuration. Copy to vars.yml and customize for your deployment.
# All values shown here are defaults — uncomment and modify as needed.
#
# Deployment modes:
#   1. Production domain: domain = "hotline.example.org"
#   2. Subdomain mode (default): app.hotline.example.org, api.hotline.example.org
#   3. Single domain: set use_subdomains: false
#   4. Home/nip.io: domain = "192-168-1-100.nip.io" or local IP

# ─── Domain & TLS ────────────────────────────────────────────────
# Your domain name. Can be:
#   - A real domain: "hotline.example.org"
#   - A nip.io domain: "192-168-1-100.nip.io" (for local/home setups)
#   - A bare IP: "203.0.113.10" (not recommended for production)
domain: ""

# API subdomain — leave empty to serve API directly from the root domain
# Examples:
#   api_subdomain: "api"   → API at https://api.hotline.example.org
#   api_subdomain: ""      → API at https://hotline.example.org
api_subdomain: ""

# Email for Let's Encrypt certificate notifications
# Required for TLS certificate issuance
acme_email: ""

# ─── SSH Hardening ────────────────────────────────────────────────
# Port to move SSH to (default 22 is heavily targeted by bots)
# Set to 22 to keep default, or change to a non-standard port
ssh_port: 22

# CIDR ranges allowed to connect via SSH
# Default allows all (0.0.0.0/0) — restrict this in production!
# Examples:
#   - Your home IP: "203.0.113.10/32"
#   - Your office: "198.51.100.0/24"
#   - Disable SSH hardening: set ssh_hardening_enabled: false below
ssh_allowed_cidrs:
  - "0.0.0.0/0"

# Set to false to skip SSH hardening (useful for local/Vagrant deployments)
ssh_hardening_enabled: true

# ─── Deploy User ─────────────────────────────────────────────────
# The user that will own the application files and run Docker containers
deploy_user: deploy
deploy_group: deploy

# ─── Service Toggles ────────────────────────────────────────────
# Enable/disable services as needed
llamenos_app_enabled: true
llamenos_postgres_enabled: true
llamenos_caddy_enabled: true
llamenos_rustfs_enabled: true
# Strfry Nostr relay — disabled by default (built-in relay is preferred)
llamenos_strfry_enabled: false
# Whisper transcription — requires GPU or significant CPU
llamenos_transcription_enabled: false
# Asterisk PBX — for self-hosted telephony
llamenos_asterisk_enabled: false
# Signal messaging bridge
llamenos_signal_enabled: false
# Kamailio SIP proxy
kamailio_enabled: false

# ─── Service Images ─────────────────────────────────────────────
# Docker images for each service
# Override these to use your own registry or specific versions
llamenos_app_image: "docker.io/llamenos/llamenos:latest"
llamenos_postgres_image: "postgres:17-alpine"
llamenos_caddy_image: "caddy:2.9-alpine"
llamenos_rustfs_image: "rustfs/rustfs:latest"
llamenos_strfry_image: "dockurr/strfry:1.0.1"
llamenos_whisper_image: "fedirz/faster-whisper-server:0.4.1"
llamenos_asterisk_image: "andrius/asterisk:20"
llamenos_signal_image: "bbernhard/signal-cli-rest-api:0.92"

# ─── Application ─────────────────────────────────────────────────
app_dir: /opt/llamenos
hotline_name: Hotline
app_environment: production

# Admin public key (hex pubkey for first admin)
# Leave empty to bootstrap via the Tauri desktop app
admin_pubkey: ""

# HMAC secret for hashing phone numbers and IPs
# Generate with: openssl rand -hex 32
hmac_secret: ""

# ─── PostgreSQL ──────────────────────────────────────────────────
# Generate with: openssl rand -hex 16
pg_password: ""
pg_pool_size: 10
llamenos_postgres_port: 5432

# ─── Storage (RustFS) ──────────────────────────────────────────
# Generate with: openssl rand -hex 16 (access key) and openssl rand -base64 32 (secret)
storage_access_key: ""
storage_secret_key: ""
storage_bucket: llamenos-files
storage_endpoint: http://rustfs:9000
storage_sse_enabled: true
llamenos_rustfs_port: 9000

# ─── Telephony (Twilio) ─────────────────────────────────────────
# Leave empty if configuring via the admin UI or using Asterisk
twilio_account_sid: ""
twilio_auth_token: ""
twilio_phone_number: ""

# ─── Nostr Relay ─────────────────────────────────────────────────
# Generate with: openssl rand -hex 32
server_nostr_secret: ""
llamenos_strfry_port: 7777

# ─── Optional Profiles ──────────────────────────────────────────
# Docker Compose profiles to enable
# Available: transcription, asterisk, signal, monitoring
compose_profiles: []

# ─── Cross-Host Networking ──────────────────────────────────────
llamenos_internal_tls_enabled: false

# ─── Backup ─────────────────────────────────────────────────────
backup_enabled: true
backup_age_public_key: ""
backup_cron_hour: "3"
backup_cron_minute: "0"
backup_rclone_remote: ""

# ─── Per-Service Backup Retention ──────────────────────────────
backup_postgres_retain_daily: 7
backup_postgres_retain_weekly: 4
backup_postgres_retain_monthly: 3

backup_strfry_retain_daily: 7
backup_strfry_retain_weekly: 4
backup_strfry_retain_monthly: 3

backup_rustfs_retain_daily: 7
backup_rustfs_retain_weekly: 4
backup_rustfs_retain_monthly: 3

backup_config_retain_daily: 14
backup_config_retain_weekly: 8
backup_config_retain_monthly: 6
backup_config_extra_paths: []

# ─── Backup Monitoring ──────────────────────────────────────────
backup_monitor_max_age_hours: 26

# ─── Docker Hardening ───────────────────────────────────────────
# Enable Docker userns-remap for additional isolation
# Set to false if you encounter permission issues
docker_userns_remap: true

# ─── Firewall ───────────────────────────────────────────────────
# Additional ports to open (beyond SSH and HTTPS)
firewall_extra_ports: []

# ─── NTP ─────────────────────────────────────────────────────────
ntp_servers:
  - "0.pool.ntp.org"
  - "1.pool.ntp.org"
  - "2.pool.ntp.org"
  - "3.pool.ntp.org"

# ─── Observability ──────────────────────────────────────────────
observability_enabled: false
prometheus_enabled: true
grafana_enabled: true
loki_enabled: true
promtail_enabled: true
alertmanager_enabled: true
node_exporter_enabled: true
healthcheck_only: false

prometheus_image: prom/prometheus:v3.2.1
prometheus_retention: 15d
prometheus_retention_size: 5GB
prometheus_scrape_interval: 15s

grafana_image: grafana/grafana-oss:11.5.2
grafana_admin_password: ""
grafana_domain: ""
grafana_allow_signup: false

loki_image: grafana/loki:3.4.2
loki_retention_period: 168h

promtail_image: grafana/promtail:3.4.2

alertmanager_image: prom/alertmanager:v0.28.1

alert_notification_method: ntfy
alert_smtp_host: ""
alert_smtp_port: 587
alert_smtp_username: ""
alert_smtp_password: ""
alert_smtp_from: ""
alert_smtp_to: ""

alert_ntfy_url: "https://ntfy.sh"
alert_ntfy_topic: "llamenos-alerts"
alert_ntfy_token: ""

alert_webhook_url: ""

node_exporter_image: prom/node-exporter:v1.9.0

healthcheck_image: curlimages/curl:8.12.1
healthcheck_interval: 30
healthcheck_endpoints:
  - name: app
    url: "http://app:3000/api/health"
  - name: postgres
    url: "tcp://postgres:5432"
healthcheck_ntfy_url: "https://ntfy.sh"
healthcheck_ntfy_topic: "llamenos-health"

# ─── Auto-Healing & Monitoring ──────────────────────────────────
llamenos_alert_webhook: ""
llamenos_watchdog_max_failures: 3
llamenos_watchdog_max_restarts: 5
llamenos_alert_cert_expiry_days: 7
llamenos_alert_disk_percent: 85

# ─── Alerting ───────────────────────────────────────────────────
llamenos_alerting_enabled: false
llamenos_alerting_provider: ntfy
llamenos_ntfy_url: "https://ntfy.sh"
llamenos_ntfy_topic: "llamenos-alerts"
llamenos_alerting_tags: "llamenos"

# ─── Security Scanning ──────────────────────────────────────────
security_auto_updates: true
security_update_hour: "4"
security_update_minute: "0"
security_scan_severity: "CRITICAL,HIGH"
security_scan_fail_on_os_updates: false
security_generate_sbom: false

# ─── System ─────────────────────────────────────────────────────
timezone: UTC
locale: en_US.UTF-8
