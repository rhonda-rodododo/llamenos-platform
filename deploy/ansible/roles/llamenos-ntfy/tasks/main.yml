---
# ntfy/UnifiedPush broker role — deploys the push relay Android clients and
# the backend use for wake notifications (issue #717).
#
# Skips if:
#   - llamenos_ntfy_enabled is false
#   - This host is not in the llamenos_ntfy group (when the group has members)
#
# Auth model (see README.md for the full write-up):
#   - NTFY_AUTH_DEFAULT_ACCESS=deny-all — nobody gets anything unless granted.
#   - `ntfy_publish_username` gets write-only access to every topic, and is
#     the only identity that can publish. Its bearer token is generated by
#     this role (ntfy cannot be told to accept an operator-chosen token
#     value — only `ntfy token add` can mint one) and exposed as the
#     `ntfy_auth_token` fact, which roles/llamenos-app reads via the shared
#     _worker-required-env.j2 template. This role MUST run before
#     roles/llamenos-app in playbooks/deploy.yml for that fact to exist in
#     time — see the "Deploy infrastructure services" play.
#   - `everyone` (anonymous) gets read-only access to every topic. This is
#     required because UnifiedPush subscribers (the Android app) have no
#     credential to present — the topic name itself (a random, unguessable
#     string chosen by the ntfy Android library) is the capability. Anyone
#     without the exact topic name gets nothing; anonymous *write* is never
#     granted, so an unauthenticated publish is always rejected.

- name: Skip if ntfy not enabled
  ansible.builtin.meta: end_play
  when: not (llamenos_ntfy_enabled | default(false) | bool)

- name: Skip if not assigned to this host
  ansible.builtin.meta: end_play
  when: >
    groups.get('llamenos_ntfy', []) | length > 0 and
    inventory_hostname not in groups.get('llamenos_ntfy', [])

- name: Assert ntfy_domain is set
  ansible.builtin.assert:
    that:
      - ntfy_domain is defined
      - ntfy_domain | length > 0
    fail_msg: |
      REQUIRED: 'ntfy_domain' must be set when llamenos_ntfy_enabled is true.
      This is the public hostname Android devices and Caddy use to reach the
      broker.

      Example:
        ntfy_domain: "push.{{ domain }}"
    success_msg: "ntfy_domain: {{ ntfy_domain }}"

- name: Set the ntfy container name and state directory as facts (shared by provision.yml)
  ansible.builtin.set_fact:
    ntfy_container_name: "llamenos-ntfy-ntfy-1"
    ntfy_state_dir: "{{ app_dir }}/services/ntfy"

- name: Create ntfy service directory
  ansible.builtin.file:
    path: "{{ app_dir }}/services/ntfy"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"

- name: Template ntfy compose file
  ansible.builtin.template:
    src: compose/ntfy.j2
    dest: "{{ app_dir }}/services/ntfy/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0640"
  notify: Restart ntfy service

- name: Pull ntfy image
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/services/ntfy"
    pull: always
    state: present
    recreate: never
  register: ntfy_pull
  ignore_errors: true

- name: Start ntfy service
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/services/ntfy"
    state: present
  register: ntfy_compose

- name: Wait for ntfy health check
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llamenos_ntfy_local_port }}/v1/health"
    method: GET
    status_code: 200
  register: ntfy_health
  retries: 20
  delay: 3
  until: ntfy_health.status == 200

# Token + ACL provisioning is shared with the monolithic demo/staging path
# (roles/llamenos/tasks/main.yml), which runs the same broker inside its own
# compose project — see provision.yml for the contract.
- name: Provision the publish account, token and access control
  ansible.builtin.include_tasks: provision.yml
