---
# ntfy/UnifiedPush broker role — deploys the push relay Android clients and
# the backend use for wake notifications (issue #717).
#
# Skips if:
#   - llamenos_ntfy_enabled is false
#   - This host is not in the llamenos_ntfy group (when the group has members)
#
# Auth model (see README.md for the full write-up):
#   - NTFY_AUTH_DEFAULT_ACCESS=deny-all — nobody gets anything unless granted.
#   - `ntfy_publish_username` gets write-only access to every topic, and is
#     the only identity that can publish. Its bearer token is generated by
#     this role (ntfy cannot be told to accept an operator-chosen token
#     value — only `ntfy token add` can mint one) and exposed as the
#     `ntfy_auth_token` fact, which roles/llamenos-app reads via the shared
#     _worker-required-env.j2 template. This role MUST run before
#     roles/llamenos-app in playbooks/deploy.yml for that fact to exist in
#     time — see the "Deploy infrastructure services" play.
#   - `everyone` (anonymous) gets read-only access to every topic. This is
#     required because UnifiedPush subscribers (the Android app) have no
#     credential to present — the topic name itself (a random, unguessable
#     string chosen by the ntfy Android library) is the capability. Anyone
#     without the exact topic name gets nothing; anonymous *write* is never
#     granted, so an unauthenticated publish is always rejected.

- name: Skip if ntfy not enabled
  ansible.builtin.meta: end_play
  when: not (llamenos_ntfy_enabled | default(false) | bool)

- name: Skip if not assigned to this host
  ansible.builtin.meta: end_play
  when: >
    groups.get('llamenos_ntfy', []) | length > 0 and
    inventory_hostname not in groups.get('llamenos_ntfy', [])

- name: Assert ntfy_domain is set
  ansible.builtin.assert:
    that:
      - ntfy_domain is defined
      - ntfy_domain | length > 0
    fail_msg: |
      REQUIRED: 'ntfy_domain' must be set when llamenos_ntfy_enabled is true.
      This is the public hostname Android devices and Caddy use to reach the
      broker.

      Example:
        ntfy_domain: "push.{{ domain }}"
    success_msg: "ntfy_domain: {{ ntfy_domain }}"

- name: Set the ntfy container name as a fact (shared by every exec task below)
  ansible.builtin.set_fact:
    ntfy_container_name: "llamenos-ntfy-ntfy-1"

- name: Create ntfy service directory
  ansible.builtin.file:
    path: "{{ app_dir }}/services/ntfy"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"

- name: Template ntfy compose file
  ansible.builtin.template:
    src: compose/ntfy.j2
    dest: "{{ app_dir }}/services/ntfy/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0640"
  notify: Restart ntfy service

- name: Pull ntfy image
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/services/ntfy"
    pull: always
    state: present
    recreate: never
  register: ntfy_pull
  ignore_errors: true

- name: Start ntfy service
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/services/ntfy"
    state: present
  register: ntfy_compose

- name: Wait for ntfy health check
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llamenos_ntfy_local_port }}/v1/health"
    method: GET
    status_code: 200
  register: ntfy_health
  retries: 20
  delay: 3
  until: ntfy_health.status == 200

# ── Provision the backend's publish credential ───────────────────────────
#
# ntfy cannot accept a pre-chosen token value (unlike every other secret in
# vars.yml, which the operator generates with `openssl rand`) — a token only
# exists once `ntfy token add` mints it server-side. So instead this role
# generates one on first run, persists it next to the compose file so a
# re-run doesn't mint a second one, and publishes it as the `ntfy_auth_token`
# fact that roles/llamenos-app's env template reads. Any operator-supplied
# value for ntfy_auth_token in vars.yml is intentionally overridden here —
# see the comment on that var in vars.yml.

- name: Check for a previously-generated publish token
  ansible.builtin.stat:
    path: "{{ app_dir }}/services/ntfy/.publish-token"
  register: ntfy_token_file

- name: Generate a throwaway provisioning password (not used after account creation)
  ansible.builtin.set_fact:
    ntfy_provision_password: "{{ lookup('ansible.builtin.password', '/dev/null length=40 chars=ascii_letters,digits') }}"
  no_log: true
  when: not ntfy_token_file.stat.exists

- name: Ensure the backend publish account exists
  community.docker.docker_container_exec:
    container: "{{ ntfy_container_name }}"
    command: "ntfy user add --role=user {{ ntfy_publish_username }}"
    env:
      NTFY_PASSWORD: "{{ ntfy_provision_password }}"
  register: ntfy_user_add
  failed_when:
    - ntfy_user_add.rc != 0
    - "'already exists' not in ntfy_user_add.stderr"
  no_log: true
  when: not ntfy_token_file.stat.exists

- name: Mint a publish token for the backend account
  community.docker.docker_container_exec:
    container: "{{ ntfy_container_name }}"
    command: "ntfy token add {{ ntfy_publish_username }}"
  register: ntfy_token_add
  no_log: true
  when: not ntfy_token_file.stat.exists

- name: Persist the generated token for idempotent re-runs
  ansible.builtin.copy:
    dest: "{{ app_dir }}/services/ntfy/.publish-token"
    # `ntfy token add` writes its one-line result to stderr, not stdout.
    content: "{{ ntfy_token_add.stderr | regex_search('tk_[A-Za-z0-9]+') }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"
  no_log: true
  when: not ntfy_token_file.stat.exists

- name: Read back the persisted token
  ansible.builtin.slurp:
    src: "{{ app_dir }}/services/ntfy/.publish-token"
  register: ntfy_token_slurp
  no_log: true

- name: Expose the publish token as a fact for roles/llamenos-app to consume
  ansible.builtin.set_fact:
    ntfy_auth_token: "{{ ntfy_token_slurp.content | b64decode | trim }}"
  no_log: true

# ── Access control ────────────────────────────────────────────────────────
# Re-asserted every run so a manually-edited ACL (or a restored ntfy-data
# volume from backup) always converges back to the intended state.

- name: Grant the backend write-only access to every topic
  community.docker.docker_container_exec:
    container: "{{ ntfy_container_name }}"
    command: 'ntfy access {{ ntfy_publish_username }} "*" write-only'
  register: ntfy_access_publisher
  changed_when: "'granted' in ntfy_access_publisher.stderr"

- name: Grant anonymous subscribers read-only access to every topic
  community.docker.docker_container_exec:
    container: "{{ ntfy_container_name }}"
    command: 'ntfy access everyone "*" read-only'
  register: ntfy_access_anon
  changed_when: "'granted' in ntfy_access_anon.stderr"
