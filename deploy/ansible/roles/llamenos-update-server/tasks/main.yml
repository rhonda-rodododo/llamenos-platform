---
# llamenos-update-server: prepares the desktop-updater artifacts tree.
# Only enabled in the "official" deployment profile.
#
# There is deliberately NO separate web server here. The updates/releases
# hostnames are vhosts of the single Caddy in roles/llamenos-caddy, which
# bind-mounts this directory read-only at /srv/updates. (A previous version ran
# a second Caddy bound to 127.0.0.1:3080/3443: it could never complete ACME —
# ports 80/443 belong to the main Caddy — nothing routed public traffic to it,
# and it crash-looped on `read_only: true` because its access log pointed at
# /var/log/caddy.)
#
# Layout served (tauri.conf.json -> plugins.updater.endpoints):
#   {{ update_artifacts_dir }}/desktop/latest.json
#   {{ update_artifacts_dir }}/desktop/v<version>/<installer + .sig>
# Populate it as documented in docs/runbooks/desktop-update-release.md.

- name: Skip update-server if not enabled
  ansible.builtin.meta: end_play
  when: not (llamenos_update_server_enabled | default(false) | bool)

- name: Create update server directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"
  loop:
    - "{{ update_artifacts_dir }}"
    - "{{ update_artifacts_dir }}/desktop"
