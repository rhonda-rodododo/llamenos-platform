---
# DEPRECATED: This monolithic deployment role is kept for backward compatibility.
# New deployments should use per-service roles (llamenos-app, llamenos-postgres, etc.)
# with the multi-host inventory and orchestration playbook.
#
# To migrate: ansible-playbook playbooks/migrate-to-multi-host.yml --ask-vault-pass
#
# Original description:
# - Creates app directory structure
# - Templates docker-compose.yml, .env, and Caddyfile
# - Pulls Docker images
# - Starts the stack with docker compose
# - Waits for the health check endpoint to respond

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"

- name: Create data directories
  ansible.builtin.file:
    path: "{{ app_dir }}/{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0750"
  loop:
    - backups
    - scripts
    - logs

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0640"
  notify: Restart llamenos stack

- name: Template Caddyfile
  ansible.builtin.template:
    src: caddy.j2
    dest: "{{ app_dir }}/Caddyfile"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0640"
  notify: Restart llamenos stack

# ── ntfy/UnifiedPush push relay (issue #959) ─────────────────────────────
# Android testers can only be rung for an incoming call through this relay,
# so on the staging/demo path it is brought up and provisioned BEFORE the
# app's .env is rendered: the backend's publish token only exists once
# `ntfy token add` has run inside the running broker, and the .env must
# carry it. Compose validates every service's env_file when it loads the
# project (even for `up ntfy`), so an empty placeholder .env is created
# first on a fresh host; it is overwritten with the real one right after.
- name: Ensure a .env file exists so compose can load the project
  ansible.builtin.file:
    path: "{{ app_dir }}/.env"
    state: touch
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"
    modification_time: preserve
    access_time: preserve
  when: llamenos_ntfy_enabled | default(false) | bool

- name: Start the ntfy push relay
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    services: [ntfy]
    state: present
  register: ntfy_up
  when: llamenos_ntfy_enabled | default(false) | bool

- name: Wait for ntfy health check
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llamenos_ntfy_local_port | default(2586) }}/v1/health"
    method: GET
    status_code: 200
  register: ntfy_health
  retries: 20
  delay: 3
  until: ntfy_health.status == 200
  when: llamenos_ntfy_enabled | default(false) | bool

- name: Provision the ntfy publish account, token and access control
  ansible.builtin.include_role:
    name: llamenos-ntfy
    tasks_from: provision.yml
  vars:
    ntfy_container_name: "llamenos-ntfy-1"
    ntfy_state_dir: "{{ app_dir }}/ntfy"
  when: llamenos_ntfy_enabled | default(false) | bool

- name: Template .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"
  notify: Restart llamenos stack

- name: Pull Docker images
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    pull: always
    state: present
    recreate: never
  register: compose_pull

- name: Start Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    state: present
  register: compose_up

- name: Wait for PostgreSQL to be ready
  ansible.builtin.command: >
    docker compose -f {{ app_dir }}/docker-compose.yml
    exec -T postgres pg_isready -U llamenos -d llamenos
  register: pg_ready
  retries: 15
  delay: 2
  until: pg_ready.rc == 0
  changed_when: false

- name: Wait for application health check
  ansible.builtin.uri:
    url: "http://localhost:3000/api/health"
    method: GET
    status_code: 200
    return_content: true
  register: health_check
  retries: 20
  delay: 5
  until: health_check.status == 200

- name: Display deployment status
  ansible.builtin.debug:
    msg: |
      Llamenos deployed successfully.

      Application URL: https://{{ domain }}
      Health check: {{ health_check.json | default('OK') }}

      To view logs:
        ssh {{ deploy_user }}@{{ ansible_host }} 'cd {{ app_dir }} && docker compose logs -f'

      To check status:
        ssh {{ deploy_user }}@{{ ansible_host }} 'cd {{ app_dir }} && docker compose ps'
