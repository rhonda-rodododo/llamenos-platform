---
# Common role: base packages, NTP, locale, unattended-upgrades
#
# Establishes a consistent, secure baseline for the server.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

# software-properties-common is deliberately NOT installed: it does not exist in
# Debian 13 (the FDE installer's OS) and nothing here needs add-apt-repository
# (apt_repository with a plain `deb` line only needs python3-apt).
- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - apt-transport-https
      - ca-certificates
      - unattended-upgrades
      - apt-listchanges
      - chrony
      - logrotate
      - jq
      - htop
      - ncdu
      - tmux
    state: present

# System hostname: declarative so a deploy can correct whatever the installer
# baked in. Defaults to inventory_hostname (existing behaviour) unless
# llamenos_system_hostname is set.
- name: Set system hostname to {{ llamenos_system_hostname | default(inventory_hostname) }}
  ansible.builtin.hostname:
    name: "{{ llamenos_system_hostname | default(inventory_hostname) }}"

# Keep the hostname resolvable locally (Debian convention: 127.0.1.1). An
# unresolvable hostname makes sudo slow and breaks some services. Replaces the
# existing 127.0.1.1 line (dropping a stale entry for the OLD hostname); all
# other /etc/hosts entries are left untouched.
- name: Map 127.0.1.1 to the system hostname in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ llamenos_system_hostname | default(inventory_hostname) }}"
    state: present

- name: Set timezone to {{ timezone }}
  community.general.timezone:
    name: "{{ timezone }}"

- name: Set locale to {{ locale }}
  community.general.locale_gen:
    name: "{{ locale }}"
    state: present

- name: Configure Chrony NTP servers
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Enable and start Chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

# Debian's apt "archive" field is the SUITE ("stable", "stable-security"), not the
# codename, so the Ubuntu-style "${distro_id}:${distro_codename}" patterns match
# nothing on Debian and unattended SECURITY upgrades silently never run
# (`unattended-upgrade --dry-run --debug` on Debian 13 shows allowed origins
# a=trixie / a=trixie-security against packages tagged a=stable). Debian gets
# the origin+codename+label form Debian's own default config uses, which lives
# under Origins-Pattern (the legacy Allowed-Origins key cannot parse it).
- name: Configure unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      {% if ansible_facts.distribution == 'Debian' %}
      Unattended-Upgrade::Origins-Pattern {
          "origin=Debian,codename=${distro_codename},label=Debian";
          "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
      {% else %}
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}";
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
      };
      {% endif %}

      Unattended-Upgrade::Package-Blacklist {
          "docker-ce";
          "docker-ce-cli";
          "containerd.io";
      };

      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Enable automatic updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: sudo
    shell: /bin/bash
    create_home: true
    state: present

- name: Ensure deploy user has passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ deploy_user }}"
    owner: root
    group: root
    mode: "0440"
    content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL"
    validate: "visudo -cf %s"

- name: Disable unused services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - snapd
    - snapd.socket
    - snapd.apparmor
  ignore_errors: true
