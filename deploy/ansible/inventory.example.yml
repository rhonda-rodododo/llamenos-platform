---
# Llamenos Multi-Host Ansible Inventory
#
# Copy this file to inventory.yml and fill in your server details.
#
# Usage:
#   cp inventory.example.yml inventory.yml
#   $EDITOR inventory.yml
#   just setup-all
#
# ── Single-Host (default) ──────────────────────────────────────
# Put your server in [llamenos_servers] and all services deploy there.
#
# ── Disk tier (required on every host) ─────────────────────────
# `llamenos_disk_encrypted: true` only if the host was installed with
# full-disk encryption (the FDE installer ISO, docs/deployment/iso-install.md).
# A host marked false may run ONLY the ntfy push relay: preflight refuses to
# place the app, database or storage on it (including via an empty group —
# see below), and backups/restores/updates/observability skip it.
#
# ── Multi-Host (split services across machines) ────────────────
# Add hosts to specific service groups to control placement.
# A host can be in multiple groups. Services deploy only to hosts
# in their group. If a service group is empty, that service deploys
# to all llamenos_servers hosts — so with more than one host, list
# every group explicitly.
#
# For multiple deployments (e.g., staging + production), create
# separate inventory files and pass them with -i:
#   ansible-playbook -i inventory-staging.yml setup.yml

all:
  vars:
    # Global variables shared across all hosts
    ansible_python_interpreter: /usr/bin/python3

  children:
    # Every Llamenos host must be in this group
    llamenos_servers:
      hosts:
        hub1:
          # Your VPS IP address or hostname
          ansible_host: 203.0.113.10

          # SSH user created during initial VPS setup
          # This user must have sudo access
          ansible_user: deploy

          # Path to your SSH private key
          ansible_ssh_private_key_file: ~/.ssh/llamenos_deploy

          # SSH port (will be changed to ssh_port after hardening)
          # Set this to 22 for the first run, then change to match ssh_port
          ansible_port: 22

          # Installed with full-disk encryption? (see "Disk tier" above)
          llamenos_disk_encrypted: true

    # ── Service Groups ──────────────────────────────────────────
    # Assign hosts to control where each service runs.
    # If a group is empty or undefined, that service runs on all
    # llamenos_servers hosts (single-host default behavior).

    # Core services
    llamenos_app:
      hosts:
        hub1: {}
    llamenos_db:
      hosts:
        hub1: {}
    llamenos_proxy:
      hosts:
        hub1: {}
    llamenos_storage:
      hosts:
        hub1: {}
    # Optional service groups — only deployed if the service is enabled
    # in vars.yml (llamenos_*_enabled: true)
    llamenos_transcription:
      hosts: {}
    llamenos_asterisk:
      hosts: {}
    llamenos_signal:
      hosts: {}
    llamenos_ntfy:
      hosts: {}

# ── Two-Tier Example (the reference deployment) ─────────────────
#
# An encrypted host runs everything that holds data or secrets; a second,
# unencrypted host runs only the ntfy push relay (for reachability and
# takedown resistance — its payloads are HPKE ciphertext). push.<domain>
# must resolve to the relay host, every other name to the encrypted one.
#
# (Splitting the app from PostgreSQL/RustFS is NOT supported: the shared
# .env template addresses them by Docker-network name.)
#
