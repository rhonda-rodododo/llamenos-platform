all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
  children:
    llamenos_servers:
      hosts:
        vps1:
          ansible_host: YOUR_SERVER_IP
          ansible_user: YOUR_DEPLOY_USER
          ansible_ssh_private_key_file: ~/.ssh/YOUR_SSH_KEY
          ansible_port: 22
    llamenos_app:
      hosts:
        vps1: {}
    llamenos_db:
      hosts:
        vps1: {}
    llamenos_proxy:
      hosts:
        vps1: {}
    llamenos_storage:
      hosts:
        vps1: {}
    llamenos_relay:
      hosts:
        vps1: {}
