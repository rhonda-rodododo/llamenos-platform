---
# Shared guard: demo/dev-only settings must never reach a production instance.
#
# Included from both entry points that can render an app environment file:
#   - playbooks/preflight.yml  (production/staging path via setup.yml -> deploy.yml)
#   - playbooks/deploy-demo.yml (demo/staging path via the monolithic llamenos role)
#
# This is deliberately independent of, and in addition to, the same check
# apps/worker/lib/config.ts performs at process startup (which would only be
# caught after the container is already running). Failing here means the
# .env file is never even rendered to disk. See issue #716.
#
# Requires app_environment, demo_mode, demo_mode_confirm, dev_routes_enabled
# and dev_reset_secret to already be in scope (via vars_files or include_vars).

- name: Assert demo/dev-only settings are never enabled in production
  ansible.builtin.assert:
    that:
      - not ((app_environment | default('production')) == 'production' and (demo_mode | default(false) | bool))
      - not ((app_environment | default('production')) == 'production' and (dev_routes_enabled | default(false) | bool))
      - not ((app_environment | default('production')) == 'production' and ((dev_reset_secret | default('')) | length > 0))
    fail_msg: |
      REFUSING TO DEPLOY: demo_mode, dev_routes_enabled and dev_reset_secret must never
      be set when app_environment is 'production'. This is a hard stop before any file
      is rendered to the target host — apps/worker/lib/config.ts enforces the same rule
      again at process startup as a second, independent layer of defense.

      Current values:
        app_environment:     {{ app_environment | default('production') }}
        demo_mode:            {{ demo_mode | default(false) }}
        dev_routes_enabled:   {{ dev_routes_enabled | default(false) }}
        dev_reset_secret set: {{ ((dev_reset_secret | default('')) | length > 0) }}

      To fix:
        - If this is genuinely a production host: unset demo_mode / dev_routes_enabled /
          dev_reset_secret in vars.yml (or demo_vars.yml).
        - If this is meant to be a demo/staging host: set app_environment to 'demo' or
          'staging' instead of 'production'.
    success_msg: "Production safety guard passed (app_environment={{ app_environment | default('production') }})"
  tags: always

- name: Assert demo_mode_confirm is the required two-factor value when demo_mode is enabled
  ansible.builtin.assert:
    that:
      - (demo_mode_confirm | default('')) == 'DESTROY_ALL_DATA'
    fail_msg: |
      REQUIRED: 'demo_mode_confirm' must be exactly 'DESTROY_ALL_DATA' when demo_mode is true.

      This mirrors the two-factor confirmation apps/worker/lib/config.ts requires at
      startup (DEMO_MODE_CONFIRM) so that a single accidental `demo_mode: true` cannot
      by itself enable scheduled destruction of all application data.

      Current value: {{ demo_mode_confirm | default('NOT SET') }}

      To fix:
        Set demo_mode_confirm: "DESTROY_ALL_DATA" alongside demo_mode: true.
    success_msg: "demo_mode_confirm: [set correctly]"
  when: demo_mode | default(false) | bool
  tags: always
