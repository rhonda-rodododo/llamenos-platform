# CI workflow for mobile (iOS + Android) release builds.
# Builds signed mobile apps and uploads to TestFlight / Play Store / GitHub Releases.
#
# Trigger: workflow_dispatch only, from release.yml's `dispatch` job (see #712).
# This workflow used to also declare `on: release: [published]`, but GitHub
# Releases created by GITHUB_TOKEN (as release.yml does) never fire that event
# — the anti-recursion rule documented in release.yml's header — so that
# trigger was provably dead and has been removed (#712). `gh workflow run`
# always dispatches via workflow_dispatch regardless of how it is invoked.
# Epic 210: Mobile Release Prep, Epic 290: Mobile App Distribution & Update Management.

name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.2.3)"
        required: false

permissions: {}  # deny-all; per-job permissions below

env:
  # Safely capture workflow_dispatch input at top level
  INPUT_VERSION: ${{ github.event.inputs.version }}

jobs:
  # ─── Android Release ─────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    name: Build (Android)
    timeout-minutes: 30
    permissions:
      contents: write   # needed for gh release create/upload in this job
      id-token: write
      attestations: write

    environment: android-release

    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # The secret is named PLAY_SERVICE_ACCOUNT (verify-release-live.yml reads
      # the same one). This used to say PLAY_SERVICE_ACCOUNT_JSON, which does
      # not exist, so the Play upload was silently skipped on every run.
      HAS_PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT != '' }}
      # app/build.gradle.kts relocates the Gradle build dir to $RUNNER_TEMP on
      # Linux (ecryptfs workaround for self-hosted dev boxes), which would put
      # every output OUTSIDE apps/android/app/build/ — where the checksum,
      # attestation, upload-artifact, fastlane and release-upload steps below
      # all look. Pin it back so those paths are real.
      ANDROID_BUILD_DIR: ${{ github.workspace }}/apps/android/app/build

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Rust stable (for crypto build)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: packages/crypto

      - name: Build crypto for Android
        run: |
          cd packages/crypto
          ./scripts/build-mobile.sh android

          # apps/android/app/src/release/jniLibs/ is gitignored, so it does not
          # exist in a fresh checkout; `cp` does not create its destination.
          # Only the RELEASE variant (production Argon2id, arm64-v8a +
          # armeabi-v7a) may be installed here. The debug variant (test-kdf,
          # x86_64) is deliberately never copied into a release build.
          JNI_DEST=../../apps/android/app/src/release/jniLibs
          mkdir -p "$JNI_DEST"
          cp -r dist/android/jniLibs-release/* "$JNI_DEST/"

          # Fail loudly if the tree is not exactly the two production ABIs.
          for abi in arm64-v8a armeabi-v7a; do
            test -s "$JNI_DEST/$abi/libllamenos_core.so" \
              || { echo "::error::missing release libllamenos_core.so for $abi"; exit 1; }
          done
          UNEXPECTED=$(find "$JNI_DEST" -type f ! -path "*/arm64-v8a/libllamenos_core.so" ! -path "*/armeabi-v7a/libllamenos_core.so")
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::unexpected files in release jniLibs (debug/test-kdf leak?): $UNEXPECTED"
            exit 1
          fi
          # Defence in depth: a debug (test-kdf) build must never be present.
          if [ -e ../../apps/android/app/src/debug/jniLibs ]; then
            echo "::error::apps/android/app/src/debug/jniLibs exists in a release build"
            exit 1
          fi

      - name: Setup Bun (for codegen)
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies and run codegen
        run: bun install --frozen-lockfile && bun run codegen && bun run i18n:codegen

      - name: Resolve version
        id: version
        env:
          INPUT_VER: ${{ inputs.version }}
        run: |
          # Only workflow_dispatch triggers this workflow now (#712) — the
          # `release` event branch this used to have was unreachable dead
          # code (GITHUB_TOKEN-created releases never fire `release: published`)
          # and has been removed.
          if [[ -n "$INPUT_VER" ]]; then
            echo "version=${INPUT_VER}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Require signing credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # build.gradle.kts silently produces an UNSIGNED release when the
          # credentials are absent. An unsigned APK is not installable, so a
          # beta build without a keystore must fail here, not upload junk.
          missing=0
          for v in HAS_KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            val="${!v}"
            if [ -z "$val" ] || [ "$val" = "false" ]; then
              echo "::error::release signing credential missing: $v"
              missing=1
            fi
          done
          exit $missing

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > apps/android/release.keystore

      - name: Sync version from dispatch input
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RESOLVED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VERSION="$RESOLVED_VERSION"
          echo "Building version: ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          # versionName is managed by knope — do not patch here.
          # versionCode is monotonic (GitHub run_number) for Play Store compliance.
          sed -i "s/versionCode = [0-9]*/versionCode = ${RUN_NUMBER}/" apps/android/app/build.gradle.kts

      - name: Build release AAB (Play Store)
        working-directory: apps/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/apps/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Build release APK (direct download)
        working-directory: apps/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/apps/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify release artifacts (signed, production native libs only)
        run: |
          OUT=apps/android/app/build/outputs
          APK=$(find "$OUT/apk/release" -name "*.apk" | head -1)
          AAB=$(find "$OUT/bundle/release" -name "*.aab" | head -1)
          [ -n "$APK" ] || { echo "::error::no release APK produced under $OUT/apk/release"; exit 1; }
          [ -n "$AAB" ] || { echo "::error::no release AAB produced under $OUT/bundle/release"; exit 1; }

          # 1. Signed (an unsigned APK is not installable).
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found under $ANDROID_HOME/build-tools"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          # 2. Native crypto present for exactly the production ABIs.
          #    An APK without libllamenos_core.so builds fine but every crypto
          #    call fails at runtime (CryptoService.nativeLibLoaded=false).
          #    x86/x86_64 would mean the emulator test-kdf variant leaked in.
          for f in "$APK" "$AAB"; do
            LIBS=$(unzip -Z1 "$f" | grep -E '(^|/)lib/[^/]+/libllamenos_core\.so$' || true)
            echo "native crypto libs in $f:"; echo "$LIBS"
            for abi in arm64-v8a armeabi-v7a; do
              echo "$LIBS" | grep -q "lib/$abi/libllamenos_core.so" \
                || { echo "::error::$f is missing lib/$abi/libllamenos_core.so"; exit 1; }
            done
            if echo "$LIBS" | grep -Eq 'lib/(x86|x86_64)/'; then
              echo "::error::$f contains an x86/x86_64 crypto lib — emulator/test-kdf variant leaked into a release build"
              exit 1
            fi
          done

      - name: Generate APK checksum
        run: |
          APK=$(find apps/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          [ -n "$APK" ] || { echo "::error::no release APK to checksum"; exit 1; }
          sha256sum "$APK" > "${APK}.sha256"
          echo "APK checksum:"
          cat "${APK}.sha256"

      - name: Generate SLSA build provenance for Android artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2.1.0
        with:
          subject-path: |
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release
          path: |
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/apk/release/*.sha256
            apps/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      # Runs BEFORE the Play upload so an installable APK is attached to the
      # release even if the Play Console step fails (it fails loudly, after this).
      - name: Upload Android artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TAG="v${VERSION}"

          # Create the release if it doesn't exist yet — needed for both the
          # binaries below and the build-metadata record further down, which
          # must land even on runs that produce no APK (e.g. an upload
          # failure), so the live-verification workflow (#721) can tell
          # "no build metadata recorded" apart from "metadata says X but
          # Play Console shows Y".
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" &>/dev/null; then
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes --draft
          fi

          # Find the APK and checksum
          APK=$(find apps/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          CHECKSUM=$(find apps/android/app/build/outputs/apk/release -name "*.sha256" | head -1)
          # A release with no installable artifact is a failed run, not a
          # green one: the earlier verify step guarantees these exist.
          if [ -z "$APK" ] || [ -z "$CHECKSUM" ]; then
            echo "::error::release APK/checksum missing at upload time"
            exit 1
          fi
          gh release upload "${TAG}" "$APK" "$CHECKSUM" --clobber

          # Record which versionCode this run targeted for this release, so
          # verify-release-live.yml (#721) can compare it against whatever
          # versionCode is actually LIVE on the Play Console internal track
          # — the only way to tell a successful Play upload apart from a
          # swallowed one after the fact.
          jq -n --arg version "$VERSION" --argjson versionCode "$RUN_NUMBER" \
            '{version: $version, versionCode: $versionCode}' > android-build-meta.json
          gh release upload "${TAG}" android-build-meta.json --clobber

      - name: Setup Ruby
        if: env.HAS_PLAY_SERVICE_ACCOUNT == 'true'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/android

      - name: Upload to Play Console internal track
        if: env.HAS_PLAY_SERVICE_ACCOUNT == 'true'
        working-directory: apps/android
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: |
          echo "$GOOGLE_PLAY_JSON_KEY" > /tmp/play-key.json
          SUPPLY_JSON_KEY=/tmp/play-key.json bundle exec fastlane android internal
          rm -f /tmp/play-key.json

  # ─── iOS Release ──────────────────────────────────────────────
  build-ios:
    runs-on: macos-latest
    name: Build (iOS)
    timeout-minutes: 45
    permissions:
      contents: write   # needed for gh release upload of build metadata (#721)

    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Rust stable (for crypto build)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: packages/crypto

      - name: Build crypto XCFramework
        run: |
          cd packages/crypto
          ./scripts/build-mobile.sh ios
          cp -r dist/ios/LlamenosCoreFFI.xcframework ../../apps/ios/

      - name: Setup Bun (for codegen)
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies and run codegen
        run: bun install --frozen-lockfile && bun run codegen && bun run i18n:codegen

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Sync version from dispatch input
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="$INPUT_VERSION"
          echo "Building version: ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          # CFBundleShortVersionString is managed by knope — do not patch here.
          # CFBundleVersion (build number) is monotonic (GitHub run_number) for TestFlight.
          sed -i '' "s|<key>CFBundleVersion</key>[[:space:]]*<string>[^<]*</string>|<key>CFBundleVersion</key>\n\t<string>${RUN_NUMBER}</string>|" apps/ios/Sources/App/Info.plist

      - name: Setup Apple signing
        if: env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import certificate without writing to disk — minimal dwell time via tmpfs dir
          CERT_TMPDIR=$(mktemp -d)
          chmod 700 "$CERT_TMPDIR"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "${CERT_TMPDIR}/cert.p12"
          security import "${CERT_TMPDIR}/cert.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -rf "$CERT_TMPDIR"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Resolve Swift packages
        working-directory: apps/ios
        run: swift package resolve

      - name: Build archive
        working-directory: apps/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project Llamenos.xcodeproj \
            -scheme Llamenos \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Llamenos.xcarchive \
            -destination generic/platform=iOS \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            INFOPLIST_FILE=Sources/App/Info.plist \
            | xcpretty || true

      - name: Export IPA
        if: success()
        working-directory: apps/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Llamenos.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            | xcpretty || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: ios-release
          path: |
            apps/ios/build/export/*.ipa
            apps/ios/build/Llamenos.xcarchive/dSYMs/
          retention-days: 30

      - name: Upload to TestFlight
        if: success() && env.HAS_APPLE_API_KEY == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # Decode API key
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/"AuthKey_${APPLE_API_KEY_ID}.p8"

          # Upload via altool
          IPA=$(find apps/ios/build/export -name "*.ipa" | head -1)
          if [ -n "$IPA" ]; then
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA" \
              --apiKey "$APPLE_API_KEY_ID" \
              --apiIssuer "$APPLE_API_ISSUER_ID"
          fi

      - name: Record iOS build metadata to GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Records which build number (CFBundleVersion) this run targeted
          # for this release, so verify-release-live.yml (#721) can compare
          # it against whatever build number is actually LIVE on
          # TestFlight — the only way to tell a successful upload apart
          # from a no-op one (#743) after the fact. Runs even if the
          # archive/export/upload steps above failed, so a swallowed
          # upload shows up as "metadata says N, TestFlight has stale M"
          # rather than silently having no record to check against.
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            echo "No version resolved (workflow_dispatch ran without a version input) — nothing to record."
            exit 0
          fi
          TAG="v${VERSION}"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" &>/dev/null; then
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes --draft
          fi
          jq -n --arg version "$VERSION" --argjson buildNumber "$RUN_NUMBER" \
            '{version: $version, buildNumber: $buildNumber}' > ios-build-meta.json
          gh release upload "${TAG}" ios-build-meta.json --clobber

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true
