# CI workflow for mobile (iOS + Android) release builds.
# Builds signed mobile apps and uploads to TestFlight / Play Store / GitHub Releases.
#
# Trigger: push to tags matching v* or manual dispatch.
# Epic 210: Mobile Release Prep, Epic 290: Mobile App Distribution & Update Management.

name: Mobile Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.2.3)"
        required: false

permissions: {}  # deny-all; per-job permissions below

env:
  # Safely capture workflow_dispatch input at top level
  INPUT_VERSION: ${{ github.event.inputs.version }}

jobs:
  # ─── Android Release ─────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    name: Build (Android)
    timeout-minutes: 30
    permissions:
      contents: write   # needed for gh release create/upload in this job
      id-token: write
      attestations: write

    environment: android-release

    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Install Rust stable (for crypto build)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: packages/crypto

      - name: Build crypto for Android
        run: |
          cd packages/crypto
          ./scripts/build-mobile.sh android
          cp -r dist/android/jniLibs-release/* ../../apps/android/app/src/release/jniLibs/

      - name: Setup Bun (for codegen)
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies and run codegen
        run: bun install --frozen-lockfile && bun run codegen && bun run i18n:codegen

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VER: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$INPUT_VER" ]]; then
            echo "version=${INPUT_VER}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > apps/android/release.keystore

      - name: Sync version from dispatch input
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RESOLVED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VERSION="$RESOLVED_VERSION"
          echo "Building version: ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          # versionName is managed by knope — do not patch here.
          # versionCode is monotonic (GitHub run_number) for Play Store compliance.
          sed -i "s/versionCode = [0-9]*/versionCode = ${RUN_NUMBER}/" apps/android/app/build.gradle.kts

      - name: Build release AAB (Play Store)
        working-directory: apps/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/apps/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Build release APK (direct download)
        working-directory: apps/android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/apps/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Generate APK checksum
        run: |
          APK=$(find apps/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            sha256sum "$APK" > "${APK}.sha256"
            echo "APK checksum:"
            cat "${APK}.sha256"
          fi

      - name: Generate SLSA build provenance for Android artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v2.1.0
        with:
          subject-path: |
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release
          path: |
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/apk/release/*.sha256
            apps/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Setup Ruby
        if: env.HAS_PLAY_SERVICE_ACCOUNT == 'true'
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/android

      - name: Upload to Play Console internal track
        if: env.HAS_PLAY_SERVICE_ACCOUNT == 'true'
        working-directory: apps/android
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_PLAY_JSON_KEY" > /tmp/play-key.json
          SUPPLY_JSON_KEY=/tmp/play-key.json bundle exec fastlane android internal
          rm -f /tmp/play-key.json

      - name: Upload Android artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"

          # Find the APK and checksum
          APK=$(find apps/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          CHECKSUM=$(find apps/android/app/build/outputs/apk/release -name "*.sha256" | head -1)
          if [ -n "$APK" ]; then
            # Create release if it doesn't exist
            if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" &>/dev/null; then
              gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes --draft
            fi
            gh release upload "${TAG}" "$APK" --clobber
            if [ -n "$CHECKSUM" ]; then
              gh release upload "${TAG}" "$CHECKSUM" --clobber
            fi
          fi

  # ─── iOS Release ──────────────────────────────────────────────
  build-ios:
    runs-on: macos-latest
    name: Build (iOS)
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Rust stable (for crypto build)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: packages/crypto

      - name: Build crypto XCFramework
        run: |
          cd packages/crypto
          ./scripts/build-mobile.sh ios
          cp -r dist/ios/LlamenosCoreFFI.xcframework ../../apps/ios/

      - name: Setup Bun (for codegen)
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies and run codegen
        run: bun install --frozen-lockfile && bun run codegen && bun run i18n:codegen

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Sync version from dispatch input
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="$INPUT_VERSION"
          echo "Building version: ${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

          # CFBundleShortVersionString is managed by knope — do not patch here.
          # CFBundleVersion (build number) is monotonic (GitHub run_number) for TestFlight.
          sed -i '' "s|<key>CFBundleVersion</key>[[:space:]]*<string>[^<]*</string>|<key>CFBundleVersion</key>\n\t<string>${RUN_NUMBER}</string>|" apps/ios/Sources/App/Info.plist

      - name: Setup Apple signing
        if: env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Import certificate without writing to disk — minimal dwell time via tmpfs dir
          CERT_TMPDIR=$(mktemp -d)
          chmod 700 "$CERT_TMPDIR"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "${CERT_TMPDIR}/cert.p12"
          security import "${CERT_TMPDIR}/cert.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -rf "$CERT_TMPDIR"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

      - name: Resolve Swift packages
        working-directory: apps/ios
        run: swift package resolve

      - name: Build archive
        working-directory: apps/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project Llamenos.xcodeproj \
            -scheme Llamenos \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/Llamenos.xcarchive \
            -destination generic/platform=iOS \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            INFOPLIST_FILE=Sources/App/Info.plist \
            | xcpretty || true

      - name: Export IPA
        if: success()
        working-directory: apps/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Llamenos.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            | xcpretty || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: ios-release
          path: |
            apps/ios/build/export/*.ipa
            apps/ios/build/Llamenos.xcarchive/dSYMs/
          retention-days: 30

      - name: Upload to TestFlight
        if: success() && env.HAS_APPLE_API_KEY == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # Decode API key
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPLE_API_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/"AuthKey_${APPLE_API_KEY_ID}.p8"

          # Upload via altool
          IPA=$(find apps/ios/build/export -name "*.ipa" | head -1)
          if [ -n "$IPA" ]; then
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA" \
              --apiKey "$APPLE_API_KEY_ID" \
              --apiIssuer "$APPLE_API_ISSUER_ID"
          fi

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true
