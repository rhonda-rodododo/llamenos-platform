name: runner-smoke
on:
  push:
    branches: [ci/self-hosted-runner]
jobs:
  smoke:
    runs-on: [self-hosted, linux, x64]
    steps:
      - run: |
          echo "host: $(hostname)"; whoami; uname -m
          echo "bun: $(bun --version || echo MISSING)"
          echo "node: $(node --version || echo MISSING)"
          echo "docker: $(docker --version || echo MISSING)"
          echo "rust: $(sudo -u runner bash -lc 'source ~/.cargo/env 2>/dev/null; rustc --version' 2>/dev/null || ~/.cargo/bin/rustc --version 2>/dev/null || echo MISSING)"
          echo "buildx: $(docker buildx version || echo MISSING)"
