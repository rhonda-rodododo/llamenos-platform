# Security Audit Workflow (Epic 297)
#
# Runs on:
#   - Daily schedule (2:00 AM UTC)
#   - Push to main (when security-relevant files change)
#   - Manual dispatch
#
# Jobs:
#   1. Dependency audit (bun audit + cargo audit)
#   2. Dockerfile scanning (Trivy config scan)
#   3. Container image scanning (Trivy image scan)
#   4. Rust dependency audit (cargo-audit)

name: Security Audit

on:
  schedule:
    # Daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lockb'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/Dockerfile*'
      - 'deploy/docker/**'
      - '.github/workflows/security-audit.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'bun.lockb'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/Dockerfile*'
      - 'deploy/docker/**'
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

permissions: {}  # deny-all; per-job permissions below

env:
  BUN_VERSION: "1.3.5"

jobs:
  # ─── JavaScript/TypeScript Dependency Audit ─────────────────
  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit JS dependencies (critical)
        run: bun audit --audit-level=critical

      - name: Audit JS dependencies (all severities — informational)
        run: bun audit || true
        continue-on-error: true

  # ─── Rust Dependency Audit ─────────────────────────────────
  rust-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies (packages/crypto)
        working-directory: packages/crypto
        run: cargo audit

      - name: Audit Rust dependencies (apps/desktop)
        working-directory: apps/desktop
        run: cargo audit
        continue-on-error: true  # May fail if desktop Cargo.lock is not committed

  # ─── Dockerfile Security Scanning ──────────────────────────
  dockerfile-scan:
    # aquasecurity/trivy-action restores/installs the trivy binary under
    # $HOME/.local/bin and adds it to $GITHUB_PATH, but on the self-hosted
    # runner that PATH update doesn't take effect for the next step ("trivy:
    # command not found", exit 127) — same class of $HOME/PATH mismatch as
    # the gitleaks and ansible-lint self-hosted issues. Keep hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Scan Dockerfile.build with Trivy (SARIF, informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile.build'
          format: 'sarif'
          output: 'dockerfile-build-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      # G6 (CI gate audit, 2026-09-11): config scans are clean as of this PR
      # (fixed DS-0002 — Dockerfile.build ran as root, no USER directive).
      # Fail the build on CRITICAL/HIGH misconfigurations going forward;
      # MEDIUM stays report-only via the SARIF upload above.
      - name: Scan Dockerfile.build with Trivy (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'Dockerfile.build'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Scan deploy/docker/Dockerfile with Trivy (SARIF, informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'deploy/docker/Dockerfile'
          format: 'sarif'
          output: 'dockerfile-deploy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Scan deploy/docker/Dockerfile with Trivy (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'deploy/docker/Dockerfile'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Scan Docker Compose files with Trivy (SARIF, informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'deploy/docker'
          format: 'sarif'
          output: 'docker-compose-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Scan Docker Compose files with Trivy (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'deploy/docker'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Dockerfile.build scan results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v3
        # upload-sarif requires GitHub Advanced Security (public repos or GHAS license).
        # Skip on private repos to avoid action_required failures.
        if: always() && github.repository_visibility == 'public'
        with:
          sarif_file: 'dockerfile-build-results.sarif'
          category: 'dockerfile-build'

      - name: Upload deploy Dockerfile scan results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v3
        if: always() && github.repository_visibility == 'public'
        with:
          sarif_file: 'dockerfile-deploy-results.sarif'
          category: 'dockerfile-deploy'

      - name: Upload Docker Compose scan results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v3
        if: always() && github.repository_visibility == 'public'
        with:
          sarif_file: 'docker-compose-results.sarif'
          category: 'docker-compose'

  # ─── Container Image Vulnerability Scan ────────────────────
  image-scan:
    # Same trivy-action PATH/$HOME mismatch as dockerfile-scan — keep hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        image:
          # `deploy/docker/Dockerfile` is multi-stage; Docker defaults to its
          # LAST stage (`static`), so each entry names its stage explicitly.
          # `target: ''` means "single-stage Dockerfile, no stage to select".
          - name: app
            dockerfile: deploy/docker/Dockerfile
            context: .
            target: app
          - name: static
            dockerfile: deploy/docker/Dockerfile
            context: .
            target: static
          - name: build
            dockerfile: Dockerfile.build
            context: .
            target: ''

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          push: false
          load: true
          tags: llamenos-scan:latest
          # cache-to was missing, so cache-from never had anything to read and
          # every run rebuilt from scratch — that is what pushed the
          # Dockerfile.build leg past its timeout. Scope per matrix entry so
          # the two images don't overwrite each other's cache.
          cache-from: type=gha,scope=image-scan-${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=image-scan-${{ matrix.image.name }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'llamenos-scan:latest'
          format: 'sarif'
          output: 'image-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # G6 (CI gate audit, 2026-09-11): measured findings on 2026-09-11 —
      # 83 debian OS + 22 node-pkg HIGH/CRITICAL total, but only 3 CRITICAL
      # (perl-base, no fix available upstream yet) and those disappear
      # entirely with --ignore-unfixed. Failing on all CRITICAL/HIGH today
      # would redden CI (52 fixable HIGH findings — see the tracking issue
      # filed alongside this PR for the full list), so this hard-fails only
      # on FIXABLE CRITICAL vulnerabilities and leaves HIGH as report-only
      # via the SARIF upload and table step below.
      #
      # 2026-09-12: that measurement only covered the `app` image. The `build`
      # image tripped this gate with 5 fixable CRITICALs — an openssl CVE from
      # the Debian base and Go stdlib CVEs in the esbuild binaries sitting in
      # bun's install cache. All five were build-toolchain artefacts that
      # Dockerfile.build shipped by accident; it is now multi-stage and the
      # final image carries only /build/dist, so the gate is genuinely clean
      # rather than suppressed.
      - name: Fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'llamenos-scan:latest'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      # G7 (issue #650, re-measured 2026-09-20): CRITICAL is 0 across all three
      # matrix legs now (perl-base fixed in #668). Re-measuring the fixable-HIGH
      # action item split cleanly by layer:
      #   - Debian OS layer (`app`/`static` targets' base): 0 fixable HIGH — the
      #     43 remaining HIGH findings have no upstream fix yet (util-linux/
      #     systemd/ncurses/login family); routine `apt-get upgrade` + Dependabot
      #     base-image bumps already pick up a fix the moment one ships.
      #   - Alpine OS layer (`static` target, Caddy image): was 23 fixable HIGH
      #     (curl/c-ares/libcrypto3/libssl3) — fixed in this PR by bumping the
      #     `caddy:2.11.4-alpine`/`caddy:2.11.4-builder-alpine` digest pins to
      #     the current latest for the same tag (same Caddy version, refreshed
      #     Alpine layer only). Re-scan confirms 0 fixable HIGH remain there.
      #   - Node/npm layer (`app` target): 19 fixable HIGH (browserslist,
      #     form-data, h3, hono, nanoid, postcss, protobufjs, smol-toml, svgo,
      #     undici, vite) — fixing these means editing package.json/bun.lock,
      #     which is outside this workflow file's ownership; tracked by the
      #     "bun audit" issue referenced in #650.
      #   - Go-module layer (`static` target, our xcaddy-built caddy binary):
      #     6 fixable HIGH (golang.org/x/crypto, x/net, x/text, grpc) baked
      #     into the Caddy 2.11.4 release's resolved dependency set — a digest
      #     bump can't reach these, only an actual Caddy version bump can, and
      #     that needs Caddyfile.production + caddy-ratelimit plugin compat
      #     validation first. Left as a follow-up.
      # Scoping this gate to `vuln-type: os` hard-fails the moment a *fixable*
      # OS-package HIGH/CRITICAL appears (e.g. a base-image bump regresses)
      # without blocking on the Node/Go-module findings this workflow can't
      # fix by itself.
      - name: Fail on fixable HIGH/CRITICAL OS-package vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'llamenos-scan:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os'
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v3
        if: always() && github.repository_visibility == 'public'
        with:
          sarif_file: 'image-results.sarif'
          category: 'image-scan-${{ matrix.image.name }}'

      - name: Scan image with Trivy (table output for review)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'llamenos-scan:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ─── Crypto Guardrails (informational) ─────────────────────
  crypto-guardrails:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    timeout-minutes: 5
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check for raw unwrap() on crypto operations
        run: |
          echo "=== Checking for raw unwrap() in crypto crate ==="
          # Flag unwrap() calls that aren't in test files
          FINDINGS=$(grep -rn '\.unwrap()' packages/crypto/src/ apps/desktop/src/crypto.rs \
            --include='*.rs' \
            | grep -v '#\[cfg(test)\]' \
            | grep -v '_test\.rs:' \
            | grep -v 'tests\.rs:' \
            | grep -v 'mod tests' \
            || true)
          if [ -n "$FINDINGS" ]; then
            echo "::warning::Found unwrap() calls in crypto code (consider proper error handling):"
            echo "$FINDINGS"
          else
            echo "No unwrap() calls found in production crypto code."
          fi

      - name: Check for non-cryptographic RNG usage
        run: |
          echo "=== Checking for non-cryptographic RNG in crypto crate ==="
          FINDINGS=$(grep -rn 'use rand::' packages/crypto/src/ apps/desktop/src/crypto.rs \
            --include='*.rs' \
            | grep -v 'rand::rngs::OsRng' \
            | grep -v 'rand::CryptoRng' \
            | grep -v '_test\.rs:' \
            | grep -v 'tests\.rs:' \
            || true)
          if [ -n "$FINDINGS" ]; then
            echo "::warning::Found non-OsRng/non-CryptoRng rand usage in crypto code:"
            echo "$FINDINGS"
          else
            echo "No suspicious RNG usage found."
          fi

      - name: Check for hardcoded keys outside tests
        run: |
          echo "=== Checking for hardcoded keys in crypto code ==="
          FINDINGS=$(grep -rn -E '(0x[0-9a-fA-F]{32,}|\\x[0-9a-fA-F]{2}){8,}' \
            packages/crypto/src/ apps/desktop/src/crypto.rs \
            --include='*.rs' \
            | grep -v '_test\.rs:' \
            | grep -v 'tests\.rs:' \
            | grep -v '#\[cfg(test)\]' \
            | grep -v 'mod tests' \
            || true)
          if [ -n "$FINDINGS" ]; then
            echo "::warning::Found potential hardcoded keys in production crypto code:"
            echo "$FINDINGS"
          else
            echo "No hardcoded keys found in production crypto code."
          fi

  # ─── Rust Dependency Policy (cargo deny) ───────────────────
  # G5 (CI gate audit, 2026-09-11): this job was continue-on-error at both
  # job AND step level, and cargo install cargo-deny --locked (unpinned)
  # had drifted onto cargo-deny 0.20, whose config schema silently broke
  # deny.toml's `unmaintained = "warn"` field — the tool was failing to even
  # parse its config and producing zero results, invisibly, before this fix.
  #
  # deny.toml has been fixed for the 0.20 schema and the version is now
  # pinned. `licenses`, `bans`, and `sources` are clean for both manifests
  # and are now hard-fail. `advisories` has real, un-triaged findings
  # (RUSTSEC vulnerabilities + unmaintained crates in the openmls/libcrux
  # dependency chain — see the tracking issue filed alongside this PR) and
  # stays warn-only until that triage is complete.
  cargo-deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable

      - name: Install cargo-deny (pinned — avoid silent config-schema drift)
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check packages/crypto (licenses, bans, sources)
        run: cargo deny --manifest-path packages/crypto/Cargo.toml check licenses bans sources

      - name: Check apps/desktop (licenses, bans, sources)
        run: cargo deny --manifest-path apps/desktop/Cargo.toml check licenses bans sources

      - name: Check packages/crypto advisories (warn-only — see tracking issue)
        run: cargo deny --manifest-path packages/crypto/Cargo.toml check advisories
        continue-on-error: true

      - name: Check apps/desktop advisories (warn-only — see tracking issue)
        run: cargo deny --manifest-path apps/desktop/Cargo.toml check advisories
        continue-on-error: true
