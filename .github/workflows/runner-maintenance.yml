# Keeps the shared self-hosted runner box from filling its disk.
#
# The cache-bound jobs that run on the `hetzner`/`llamenos` runners (crypto
# tests, cargo-deny, rust-audit, container image scans) get their speed from
# state that survives between jobs. State that survives has to be bounded, or
# it becomes a recurring disk-full incident (the box reached 64% once from
# per-job checkouts and stale runner binaries alone).
#
# Bounds, and who enforces them:
#   - Rust cache (rustup / cargo / target), one directory per runner: each job
#     wipes its own runner's directory at start once it passes a hard cap.
#     Not done here — the three runners share one $HOME, and wiping a
#     directory from outside would pull it out from under a job running on
#     another runner.
#   - Docker: ONE daemon serves all three runners (and other projects), so a
#     single scheduled job bounds it for everybody. BuildKit's layer cache is
#     capped, and dangling images past a day old are dropped. Tagged images
#     are never touched here — jobs remove their own (see image-scan).
#
# Deliberately does nothing about `_work` checkouts or runner binaries: those
# belong to the runner service, not to this repo.

name: Runner Maintenance

on:
  schedule:
    # Weekly, Sunday 04:30 UTC — after security-audit (02:00) and the CI base
    # image build (03:17) so it never contends with them for a runner.
    - cron: '30 4 * * 0'
  workflow_dispatch:
  # Only when this file itself changes, so the prune commands below are
  # exercised on a runner before they ever ship on the schedule.
  pull_request:
    paths:
      - '.github/workflows/runner-maintenance.yml'

concurrency:
  group: runner-maintenance
  cancel-in-progress: false

permissions: {}  # deny-all; per-job permissions below

env:
  # Ceiling for BuildKit's layer cache. The three image-scan targets together
  # come to ~14 GB when fully cached, so this evicts the least recently used
  # layers rather than letting them all stay. Sized against the box's disk
  # (75 GB, ~32 GB baseline): 10 GB here + three Rust caches capped at 6 GB
  # each (see the persistent-cache step in ci.yml / security-audit.yml) stays
  # under ~80% even if every cache sits at its ceiling.
  BUILDKIT_CACHE_MAX: 10GB

jobs:
  prune:
    runs-on: [self-hosted, linux, x64, hetzner, llamenos]
    permissions: {}
    timeout-minutes: 15

    steps:
      - name: Disk before
        run: df -h /

      - name: Cap BuildKit layer cache
        run: docker builder prune --force --max-used-space "$BUILDKIT_CACHE_MAX"

      - name: Drop dangling images older than a day
        # `until=24h` keeps anything a job built recently; dangling images are
        # untagged, so no job or other project can be relying on them by name.
        run: docker image prune --force --filter "until=24h"

      - name: Report
        run: |
          echo "── disk ──"
          df -h /
          echo "── docker ──"
          docker system df
          echo "── per-runner Rust caches ──"
          du -sh "${HOME}"/.cache/llamenos-ci/* 2>/dev/null || echo "(none yet)"
          used_pct=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          if [ "$used_pct" -ge 80 ]; then
            echo "::warning::runner box disk is ${used_pct}% full after pruning — look at runner _work directories and stale runner binaries"
          fi
