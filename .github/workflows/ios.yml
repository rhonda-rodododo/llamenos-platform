# iOS Build & Unit Tests
#
# Runs independently from CI so the macOS job doesn't block
# every other CI check. Triggered on push/PR when iOS-relevant files change.
# UI/E2E tests are in ios-e2e.yml (4 parallel shards).

name: iOS

on:
  push:
    branches: [main, desktop]
    paths:
      - 'apps/ios/**'
      - 'packages/crypto/**'
      - 'packages/protocol/**'
      - 'packages/i18n/**'
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'packages/crypto/**'
      - 'packages/protocol/**'
      - 'packages/i18n/**'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

env:
  BUN_VERSION: "1.3.5"
  TEST_ADMIN_PUBKEY: "ac4718373d30301e5c7cf55e9e6f2568efb94f3278fb88f37f4981e880505228"

jobs:
  # --- iOS Build & Test ---
  ios-build-test:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun (for codegen)
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies and run codegen
        run: bun install --frozen-lockfile && bun run codegen

      - name: Cache crypto XCFramework
        id: xcframework-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: apps/ios/LlamenosCoreFFI.xcframework
          key: xcframework-ios-${{ runner.os }}-${{ hashFiles('packages/crypto/src/**/*.rs', 'packages/crypto/Cargo.toml', 'packages/crypto/Cargo.lock', 'packages/crypto/scripts/build-mobile.sh') }}

      - name: Install Rust stable (for crypto xcframework)
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Rust cache
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        uses: swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: packages/crypto

      - name: Build crypto XCFramework
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        run: |
          cd packages/crypto
          ./scripts/build-mobile.sh ios
          cp -r dist/ios/LlamenosCoreFFI.xcframework ../../apps/ios/

      - name: Check for hardcoded secrets in Swift source
        run: |
          if grep -rE '[0-9a-f]{64}' apps/ios/Sources/ --include="*.swift"; then
            echo "ERROR: Potential hardcoded hex secret found in iOS source"
            exit 1
          fi

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Detect simulator
        id: sim
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in sorted(data.get('devices', {}).items(), reverse=True):
              if 'iOS' in runtime:
                  for d in devices:
                      if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                          print(d['name'])
                          sys.exit(0)
          print('iPhone 16')
          ")
          echo "device=$SIM" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIM"

      - name: Build app
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Llamenos.xcodeproj \
            -scheme Llamenos \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath /tmp/llamenos-build \
            2>&1 | xcbeautify

      - name: Run unit tests
        working-directory: apps/ios
        run: |
          set -o pipefail
          mkdir -p test-results
          xcodebuild test \
            -project Llamenos.xcodeproj \
            -scheme Llamenos \
            -only-testing:LlamenosTests \
            -skip-testing:LlamenosUITests \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -derivedDataPath /tmp/llamenos-build
