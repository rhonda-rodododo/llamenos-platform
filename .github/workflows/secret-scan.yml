name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    # gitleaks-action uploads its SARIF artifact with $HOME as the artifact
    # root directory. On the self-hosted runner $HOME (/home/runner) is not a
    # parent of the work directory (/opt/runner-llamenos-*/_work/...), so the
    # upload throws even when no leaks are found. Keep this job hosted.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
