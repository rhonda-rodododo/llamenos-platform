name: Deploy Demo

# Manual-only workflow: deploy the Llamenos demo VPS instance via Ansible.
#
# Required secrets:
#   DEMO_INVENTORY_YML       — content of inventory-demo.yml (Ansible inventory)
#   ANSIBLE_VAULT_PASSWORD   — password for ansible-vault encrypted demo_vars.yml
#   DEMO_VARS_YML_ENCRYPTED  — content of encrypted demo_vars.yml
#   DEMO_SSH_PRIVATE_KEY     — SSH private key for the demo VPS deploy user

on:
  workflow_dispatch:
    inputs:
      reset_data:
        description: "Reset demo data after deploying?"
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  packages: read

jobs:
  deploy-demo:
    name: Deploy to Demo VPS
    runs-on: [self-hosted, linux, x64]
    environment: demo
    timeout-minutes: 30

    steps:
      # This job stays on the self-hosted box, where $HOME and /tmp are shared
      # by every concurrent job. Scope each toolchain's cache/state under this
      # job's own $RUNNER_TEMP so two jobs can never corrupt each other.
      - name: Isolate per-job toolchain caches
        run: |
          {
            echo "CARGO_HOME=$RUNNER_TEMP/cargo"
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup"
            echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle"
            echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache"
            echo "npm_config_cache=$RUNNER_TEMP/npm-cache"
            echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache"
            echo "ANSIBLE_COLLECTIONS_PATH=$RUNNER_TEMP/ansible-collections"
            echo "ANSIBLE_LOCAL_TEMP=$RUNNER_TEMP/ansible-tmp"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Ansible
        run: |
          pip install ansible
          ansible-galaxy collection install community.docker

      - name: Write Ansible inventory
        env:
          INVENTORY_YML: ${{ secrets.DEMO_INVENTORY_YML }}
        run: |
          mkdir -p deploy/ansible
          printf '%s' "$INVENTORY_YML" > deploy/ansible/inventory-demo.yml

      - name: Write Ansible vault password
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          printf '%s' "$VAULT_PASSWORD" > "$RUNNER_TEMP/vault-pass"
          chmod 600 "$RUNNER_TEMP/vault-pass"

      - name: Write encrypted demo vars
        env:
          DEMO_VARS: ${{ secrets.DEMO_VARS_YML_ENCRYPTED }}
        run: |
          printf '%s' "$DEMO_VARS" > deploy/ansible/demo_vars.yml

      - name: Load SSH key into agent
        env:
          SSH_KEY: ${{ secrets.DEMO_SSH_PRIVATE_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          echo "$SSH_KEY" | ssh-add -
          ssh-keyscan -H "$(grep ansible_host deploy/ansible/inventory-demo.yml | head -1 | awk '{print $2}')" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy demo instance
        working-directory: deploy/ansible
        run: |
          ansible-playbook playbooks/deploy-demo.yml \
            -i inventory-demo.yml \
            --vault-password-file "$RUNNER_TEMP/vault-pass"
        # Ansible picks up SSH_AUTH_SOCK automatically

      - name: Reset demo data
        if: ${{ inputs.reset_data }}
        working-directory: deploy/ansible
        run: |
          ansible-playbook playbooks/reset-demo.yml \
            -i inventory-demo.yml \
            --vault-password-file "$RUNNER_TEMP/vault-pass"

      - name: Stop SSH agent
        if: always()
        run: ssh-agent -k || true

      - name: Clean up secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/vault-pass"
          rm -f deploy/ansible/inventory-demo.yml
          rm -f deploy/ansible/demo_vars.yml
