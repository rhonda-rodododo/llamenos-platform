[package]
name = "llamenos-desktop"
version = "0.19.11"
edition = "2024"
rust-version = "1.88.0"

[lib]
name = "llamenos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "isolation"] }
tauri-plugin-stronghold = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared crypto core (in-repo since Epic 201)
llamenos-core = { path = "../../packages/crypto" }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
hkdf = "0.12"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
argon2 = "0.5"
subtle = "2"

[features]
default = ["custom-protocol", "updater"]
custom-protocol = ["tauri/custom-protocol"]
updater = ["dep:tauri-plugin-updater"]

# Security: RUSTSEC-2026-0124 — hpke-rs-libcrux 0.6.1 on crates.io pins libcrux-aead
# to ^0.0.7, pulling libcrux-chacha20poly1305 0.0.7 (DoS vulnerability) into the
# Cargo.lock even though the libcrux backend is never compiled (openmls_rust_crypto
# uses hpke-rs-rust-crypto, not hpke-rs-libcrux). The celabshq/hpke-rs main branch
# already bumps libcrux-aead to 0.0.8 but hasn't been released to crates.io yet.
# This patch replaces the published 0.6.1 with the git head at the same version so
# the lock file resolves libcrux-chacha20poly1305 to >=0.0.8.
[patch.crates-io]
hpke-rs-libcrux = { git = "https://github.com/celabshq/hpke-rs", package = "hpke-rs-libcrux" }
